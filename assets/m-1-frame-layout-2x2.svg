<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 320" width="290" height="320" role="img" aria-label="Four panels in a two by two grid, a Corner frame on each, four Joiner Side pieces around the outside and one Joiner Center in the middle">
  <style>
    .p { fill: #242424; stroke: #fa6831; stroke-width: 3; }
    .l { fill: #ffffff; font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; }
    .s { fill: #b8b8b8; font: 400 11px system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle; }
    .j { fill: #fa6831; }
    .jc { fill: #ffffff; stroke: #fa6831; stroke-width: 3; }
    .k { fill: #8a8a8a; font: 400 12px system-ui, -apple-system, "Segoe UI", sans-serif; }
  </style>
  <rect class="p" x="20" y="20" width="120" height="120" rx="4"/>
  <rect class="p" x="150" y="20" width="120" height="120" rx="4"/>
  <rect class="p" x="20" y="150" width="120" height="120" rx="4"/>
  <rect class="p" x="150" y="150" width="120" height="120" rx="4"/>
  <text class="l" x="80" y="80">Corner</text>
  <text class="l" x="210" y="80">Corner</text>
  <text class="l" x="80" y="205">Corner</text>
  <text class="s" x="80" y="223">rotated 180&#176;</text>
  <text class="l" x="210" y="205">Corner</text>
  <text class="s" x="210" y="223">rotated 180&#176;</text>
  <circle class="j" cx="145" cy="32" r="8"/>
  <circle class="j" cx="145" cy="258" r="8"/>
  <circle class="j" cx="32" cy="145" r="8"/>
  <circle class="j" cx="258" cy="145" r="8"/>
  <rect class="jc" x="135" y="135" width="20" height="20" rx="3"/>
  <circle class="j" cx="26" cy="296" r="7"/>
  <text class="k" x="40" y="300">Joiner Side</text>
  <rect class="jc" x="146" y="289" width="15" height="15" rx="3"/>
  <text class="k" x="168" y="300">Joiner Center</text>
</svg>
